name: Provider Governance Temporal Integrity

on:
  pull_request:
    paths:
      - 'evaluations/state-providers/**'
      - 'evaluations/signing-key-providers/**'
      - 'decisions/state-providers/**'
      - 'decisions/signing-key-providers/**'
      - 'evidence/provider-evaluations/**'
      - 'reviews/provider-evidence/**'
      - 'tools/validate_provider_governance_time.py'
      - 'tests/test_provider_governance_time.py'
      - '.github/workflows/provider-governance-temporal-integrity.yml'
  push:
    branches:
      - main
      - 'upgrade/privacy-shield-2-*'
    paths:
      - 'evaluations/state-providers/**'
      - 'evaluations/signing-key-providers/**'
      - 'decisions/state-providers/**'
      - 'decisions/signing-key-providers/**'
      - 'evidence/provider-evaluations/**'
      - 'reviews/provider-evidence/**'
      - 'tools/validate_provider_governance_time.py'
      - 'tests/test_provider_governance_time.py'
      - '.github/workflows/provider-governance-temporal-integrity.yml'

permissions:
  contents: read

jobs:
  temporal-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact Privacy Shield revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate repository provider-governance timestamps
        run: python tools/validate_provider_governance_time.py

      - name: Run temporal-integrity regression tests
        run: python -m unittest tests.test_provider_governance_time
