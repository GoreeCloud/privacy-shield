    notes: Privacy Shield implements a bounded non-authorizing Everkeep lifecycle handoff pinned to canonical GoreeCloud/everkeep revision f69e369e4d8627280fac728b7f7bcb02c43b5edd. The current canonical continuity.status schema is byte-identical to the historical schema previously pinned by Privacy Shield. Live Everkeep ingestion/execution, backup/restore, export/portability, target-environment recovery evidence, and production acceptance remain migration-required.
  glaze_ui:
    result: applicable-migration-required
    version: 1.6.0
    evidence:
    - docs/integrations/privacy-center-static-site.md
    - website/README.md
    notes: The canonical Privacy Center source is now the single retained GoreeCloud website route at GoreeCloud/static-websites sites/main/privacy/index.html and declares the current GLAZE UI V1.6 / 1.6.0 target. Exact-current downstream human/rendered/accessibility/performance/resilience/rollback consumer acceptance remains incomplete, and this repository's website/ directory remains a historical 2.1.0 legacy/transitional deployment copy rather than current source authority.
  mesh:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/mesh.integration.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    - src/mesh-delivery.mjs
    - src/platform-registry-delivery.mjs
    notes: Source-level minimized privacy-evidence delivery and producer-bound Platform Registry delivery are implemented and exact-head validated with authority_transfer=false, scoped per-delivery Identity credentials, producer/receipt binding, and secret-safe error handling. Production delivery still requires deployed GoreeCloud Identity issuance/JWKS trust, live Mesh routing and acceptance, and current-contract runtime validation.
    capabilities:
    - privacy-evidence-producer
    - platform-registry-producer
    dependencies:
    - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    - contracts/mesh.integration.json
    - src/mesh-delivery.mjs
    - src/platform-registry-delivery.mjs
    notes: Privacy Shield implements source-validated fresh credential-provider boundaries for Mesh evidence and Platform Registry publication using narrowly scoped GoreeCloud Identity credentials. Deployed issuance, JWKS/key custody, rotation/revocation operations, live acceptance, and current-contract validation remain pending.
  policy:
    result: applicable-migration-required
    version: null
    evidence:
    - src/platform-policy-contract.mjs
    - tests/platform-policy-contract.test.mjs
    - docs/integrations/policy.md
    notes: Privacy Shield now has source-level request construction and decision-evidence validation for the authoritative GoreeCloud Policy v1 contracts pinned to Policy revision 46071886da37a6566b69cc923005eef64cce2bcc. A valid Policy decision does not become Privacy Shield consent, capability, or execution authority. No live caller identity, authenticated decision exchange, policy distribution, freshness/expiry acceptance, obligations handling, enforcement coordination, target-environment evidence, or production acceptance is established.
  observability:
    result: applicable-migration-required
    version: null
    evidence:
    - src/observability-signal.mjs
    - tests/observability-signal.test.mjs
    - docs/integrations/observability.md
    notes: Privacy Shield now has a source-level privacy-minimized constructor for the authoritative GoreeCloud Observability v1 operational-signal contract pinned to Observability revision a7f6a65f442d3e517baddbe7b6ce7c250d142c8c. No live authenticated publication, collection, freshness/completeness acceptance, retention/deletion acceptance, diagnostics/alerting, target-environment evidence, or production acceptance is established.

health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - The validated single-host durable state store preserves Privacy Shield-owned consent, policy, capability replay or revocation, and evidence state with owner-only local persistence and bounded backup recovery behavior.
    - Protect durable Privacy Shield-owned state through an accepted Everkeep-aligned backup scope before production dependence; local file durability alone is not production recovery acceptance.
  restore:
    required: true
    requirements:
    - Validate clean Everkeep-backed restoration and integrity of durable Privacy Shield-owned authorization and evidence state before production or Stable qualification.
    - Preserve replay/revocation and evidence-integrity semantics across accepted restore operations rather than treating backup existence as verified recovery.
  export:
    required: true
    requirements:
    - Provide documented portable export for Privacy Shield-owned persisted state where state is retained.
  portability:
    required: true
    requirements:
    - Keep Privacy Shield contracts, policy state, consent state, and evidence independently understandable and portable without requiring a proprietary control plane.
