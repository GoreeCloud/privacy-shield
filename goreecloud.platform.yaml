schema_version: '0.2'
component:
  type: service
  id: goreecloud-privacy-shield
  product_name: GoreeCloud Privacy Shield
  repository: GoreeCloud/goreecloud-privacy-shield
lifecycle: development
version: '0.1'
supported_platforms:
- web
- firefox
api:
  versions: []
  endpoints: []
platform_systems:
  manager:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/PLATFORM-ADOPTION.md
    - contracts/privacy-shield.status.schema.json
    notes: GoreeCloud Manager has a merged privacy-safe read-only status consumer, but no accepted Privacy Shield runtime status producer is currently active for that path and current-contract acceptance remains incomplete.
  privacy_shield:
    result: not-applicable-justified
    version: '0.1'
    evidence:
    - contracts/privacy-shield.platform.json
    - contracts/privacy-shield.identity.json
    notes: This repository implements the GoreeCloud Privacy Shield platform privacy authority itself; a separate Privacy-Shield-to-Privacy-Shield integration is not applicable.
  wardveil_security:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/PLATFORM-ADOPTION.md
    - contracts/privacy-shield.platform.json
    notes: Wardveil Security has a merged read-only Privacy Shield presentation boundary, while runtime-specific Privacy Shield production and current-contract acceptance remain independent and incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    notes: Everkeep is the resilience and preservation authority for applicable lifecycle, backup, restore, deletion, export, and succession effects, but no accepted Everkeep runtime integration is claimed here.
  glaze_ui:
    result: applicable-migration-required
    version: 2.1.0
    evidence:
    - website/GLAZE-UI-2.1-ADOPTION.md
    - website/glaze-ui-2.1.0.css
    notes: The accepted Privacy Center source declares Glaze UI 2.1.0. The current Platform Contract baseline is 1.1.0, so repository-specific reconciliation and exact-revision acceptance remain required.
  mesh:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/mesh.integration.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    notes: Source-level minimized evidence delivery and coordination contracts exist with authority_transfer=false; production delivery still requires deployed GoreeCloud Identity credentials/JWKS, live Mesh acceptance, and current-contract validation.
    capabilities: []
    dependencies:
    - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    notes: The accepted source contract requires short-lived GoreeCloud Identity-issued service credentials for production Mesh delivery, while deployed issuance, JWKS/key custody, live acceptance, and current-contract validation remain pending.
health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Protect any durable Privacy Shield-owned consent, policy, capability replay or revocation, and evidence state through an accepted Everkeep-aligned backup scope before production dependence.
  restore:
    required: true
    requirements:
    - Validate clean restoration and integrity of durable Privacy Shield-owned authorization and evidence state before production or Stable qualification.
  export:
    required: true
    requirements:
    - Provide documented portable export for Privacy Shield-owned persisted state where state is retained.
  portability:
    required: true
    requirements:
    - Keep Privacy Shield contracts, policy state, consent state, and evidence independently understandable and portable without requiring a proprietary control plane.
external_dependencies: []
compatibility:
  platform_contract: '0.2'
  glaze_ui_required: 1.1.0
  requires:
  - goreecloud-platform-contract==0.2
  - glaze-ui==1.1.0
  provides: []
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - contracts/privacy-shield.platform.json
  - contracts/privacy-shield.identity.json
  - contracts/mesh.integration.json
  - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
  - docs/PLATFORM-ADOPTION.md
  - website/GLAZE-UI-2.1-ADOPTION.md
  blockers:
  - GoreeCloud Privacy Shield remains in Development and its platform authorization core is not production accepted.
  - Privacy Center requires reconciliation and exact-revision acceptance against the current Platform Contract Glaze UI baseline.
  - Durable consent, policy, capability replay or revocation, and privacy evidence state require production acceptance beyond source-level prototypes.
  - Production signing-key custody and rotation operations remain pending.
  - Live GoreeCloud Identity-issued service credentials, deployed JWKS trust, and end-to-end Mesh delivery acceptance remain pending.
  - Everkeep production backup, restore, export, portability, and recovery acceptance remain pending.
  - Runtime-specific Browser, DNS, Network, application, and other Privacy Shield adapters retain independent acceptance gates.
  - Target-environment runtime, failure-mode, recovery, publication, and production acceptance remain pending.
