  wardveil_security:
    result: applicable-migration-required
    version: null
    evidence:
    - docs/PLATFORM-ADOPTION.md
    - contracts/privacy-shield.platform.json
    notes: Wardveil Security has a merged read-only Privacy Shield presentation boundary, while runtime-specific Privacy Shield production and current-contract acceptance remain independent and incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    - src/privacy-state-store.mjs
    notes: Everkeep is the resilience and preservation authority for applicable lifecycle, backup, restore, deletion, export, and succession effects. Privacy Shield now has validated single-host durable state and local backup recovery primitives, but no accepted Everkeep runtime backup/restore integration is claimed here.
  glaze_ui:
    result: applicable-migration-required
    version: 2.1.0
    evidence:
    - website/GLAZE-UI-2.1-ADOPTION.md
    - website/glaze-ui-2.1.0.css
    notes: Privacy Center source still carries the pre-reset Glaze UI 2.1.0 implementation. The current shared consumer target is GLAZE UI V1.6 / 1.6.0, so repository-specific migration, rendered acceptance, accessibility/resilience validation, rollback, and production acceptance remain required.
  mesh:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/mesh.integration.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    - src/mesh-delivery.mjs
    - src/platform-registry-delivery.mjs
    notes: Source-level minimized privacy-evidence delivery and producer-bound Platform Registry delivery are implemented and exact-head validated with authority_transfer=false, scoped per-delivery Identity credentials, producer/receipt binding, and secret-safe error handling. Production delivery still requires deployed GoreeCloud Identity issuance/JWKS trust, live Mesh routing and acceptance, and current-contract runtime validation.
    capabilities:
    - privacy-evidence-producer
    - platform-registry-producer
    dependencies:
    - goreecloud-identity
    published_events: []
    consumed_events: []
  identity:
    result: applicable-migration-required
    version: null
    evidence:
    - contracts/privacy-shield.platform-evidence.runtime-acceptance.json
    - contracts/privacy-shield.mesh-evidence-profile.json
    - contracts/mesh.integration.json
    - src/mesh-delivery.mjs
    - src/platform-registry-delivery.mjs
    notes: Privacy Shield implements source-validated fresh credential-provider boundaries for Mesh evidence and Platform Registry publication using narrowly scoped GoreeCloud Identity credentials. Deployed issuance, JWKS/key custody, rotation/revocation operations, live acceptance, and current-contract validation remain pending.
  policy:
    result: applicable-blocked
    version: null
    evidence:
    - docs/PLATFORM-ADOPTION.md
    - README.md
    notes: Privacy Shield owns privacy-domain authorization and data-use rules within its authority, but GoreeCloud Policy is a separate Integral Platform System. No accepted GoreeCloud Policy runtime contract, shared decision exchange, distribution, enforcement-coordination integration, or component-specific acceptance is established for Privacy Shield.
  observability:
    result: applicable-blocked
    version: null
    evidence:
    - docs/PLATFORM-ADOPTION.md
    - README.md
    notes: Privacy Shield has privacy-safe evidence and status boundaries, but GoreeCloud Observability remains a separate Integral Platform System. No accepted Observability runtime integration, telemetry/health contract, freshness/completeness acceptance, or component-specific production evidence is established for Privacy Shield.

health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - The validated single-host durable state store preserves Privacy Shield-owned consent, policy, capability replay or revocation, and evidence state with owner-only local persistence and bounded backup recovery behavior.
    - Protect durable Privacy Shield-owned state through an accepted Everkeep-aligned backup scope before production dependence; local file durability alone is not production recovery acceptance.
  restore:
    required: true
    requirements:
    - Validate clean Everkeep-backed restoration and integrity of durable Privacy Shield-owned authorization and evidence state before production or Stable qualification.
    - Preserve replay/revocation and evidence-integrity semantics across accepted restore operations rather than treating backup existence as verified recovery.
  export:
    required: true
    requirements:
    - Provide documented portable export for Privacy Shield-owned persisted state where state is retained.
  portability:
    required: true
    requirements:
    - Keep Privacy Shield contracts, policy state, consent state, and evidence independently understandable and portable without requiring a proprietary control plane.
